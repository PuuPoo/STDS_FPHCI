<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="../Stylesheets/LecSendForum.css">
    <script src="../Javascript/LecSendForum.js"></script>
</head>


<body>
    <div class="navbar">
        <h1 class="main_title">Student-teacher data System</h1>

        <div class="nav_right">

            <div class="nav_items">
                <button class="student_button" onclick="location.href='LecturerStudents.html'"> <p>Students</p> </button>
                <button class="forum_button" onclick="location.href='LecViewForum.html'"> <p>Forums</p> </button>
            </div>
            
            <div class="prof_pic">
                <img src="../Assets/Icon.png" alt="profile-details">
            </div> 
    
        </div>

    </div>

    <div class="middle">

        <div class="back_button", onclick = "location.href='../Scripts/LecViewForum.html'">
            <button><img src="../Assets/back arrow.png" alt=""></button>
        </div>

        <div class="send_button">
            <button><p>Send Opinion</p></button>
        </div>

    </div>

    <div class="main_forum_container">

        <div class="name_section">
            <p>Name: </p>
            <input type="text", placeholder="Place your recipient name" class="name_input" >
        </div>

        <div class="about_section">
            <p>About: </p>
            <input type="text" placeholder="Input Title" class="about_input">
            <button id="flagButton" data-state="white">

            </button>
        </div>

        <div class="opinion_section" class="no-resize" rows="4" cols="50">
            <textarea class="opinion_input", placeholder="Place your input here"></textarea>
        </div>

    </div>

</html>
