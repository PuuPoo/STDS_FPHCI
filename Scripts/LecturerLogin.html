<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel = "stylesheet" href="../Stylesheets/styleLoginField.css" />
    <title>Student Login</title>
</head>

<body>


    <h1>STUDENT TEACHER DATA SYSTEM</h1>


    <div class = "Login-Box">
        <h2>Lecturer LOG IN</h2>


        <!-- Login box, target html-->
        <form action = "LecturerHome.html">

            <label for = "username">Username</label>
            <input type = "text" id = "username" name = "username" placeholder="Username or Email">




            <label for = "password">Password</label>
            <input type = "password" id = "password" name = "password" placeholder="">


            <button type = "submit" class = "Login-Button">Login</button>
        </form>
    </div>


</body>
</html>
